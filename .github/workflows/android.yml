name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    # Pinned: ubuntu-latest moves to a newer Ubuntu on GitHub's schedule (Ubuntu 26 from 19 Oct 2026), which can
    # break the build with no change here. Move it on purpose.
    runs-on: ubuntu-24.04
    env:
      # The unit tests read this for how many test JVMs to run (app/build.gradle.kts).
      BB_TEST_WORKERS: 4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      # What the build pins: platform and build-tools 36, and for Shebang Voice the NDK and CMake in
      # voice/build.gradle.kts. setup-android v3 asked for the retired 'tools' package and failed.
      - uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;29.0.14206865
            cmake;4.1.2
      - uses: gradle/actions/setup-gradle@v6
      # Shebang Voice's speech model (57 MB) is not in git; its build stops without it. Keyed on the
      # checksum in the fetch script, so a new model is downloaded once.
      - name: Cache the speech model
        uses: actions/cache@v6
        with:
          path: voice/src/main/assets/models
          key: voice-model-${{ hashFiles('tools/fetch_voice_model.sh') }}
      - name: Fetch the speech model
        run: tools/fetch_voice_model.sh
      - name: Build, test, lint
        run: ./gradlew assembleDebug test lint --stacktrace
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            voice/build/reports/
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

  # The keyboard in real fields (FieldCompatibilityTest, R33/R38): an API 36 emulator on the runner's KVM types
  # through the real keyboard into EditText, Compose and WebView fields and a terminal-like view.
  device-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      # The same packages as the build job: the voice module is configured too, though not built here.
      - uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;29.0.14206865
            cmake;4.1.2
      - uses: gradle/actions/setup-gradle@v6
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Device tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
      # Gradle names a failed device test only deep in the log; this puts each one, with the first line of its
      # failure, in the run's Annotations, where "exit code 1" alone showed before.
      - name: Name the failed device tests
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, html, re
          for path in glob.glob('app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True):
              text = open(path, encoding='utf-8').read()
              for m in re.finditer(r'<testcase name="([^"]+)" classname="([^"]+)"[^>]*>\s*<failure[^>]*>(.*?)</failure>', text, re.S):
                  first = html.unescape(m.group(3)).strip().splitlines()[0][:300]
                  print(f"::error title=Device test failed::{m.group(2).split('.')[-1]}.{m.group(1)}: {first}")
          EOF
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: device-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
